[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdikt"
version = "0.1.0"
description = "A local-first preference learning platform"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "pypdf>=4.0",
    "markdown>=3.6",
    "click>=8.1",
    "ollama>=0.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.scripts]
verdikt = "verdikt.cli:app"

[project.entry-points."verdikt.plugins"]
filedrop = "verdikt.plugins.filedrop:FileDropPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "infra: requires running Ollama and ChromaDB (skip with -m 'not infra')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verdikt*"]
