[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdikt"
version = "0.1.0"
description = "A local-first preference learning platform"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "pypdf>=4.0",
    "striprtf>=0.0.26",
    "markdown>=3.6",
    "click>=8.1",
    "ollama>=0.2",
    "Pillow>=10.0",
    "torchvision>=0.16",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "prefect>=3.0",
    "requests>=2.31",
    "curl-cffi>=0.7",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "sqlcipher3>=0.5",
    "email-validator>=2.1",
    "zxcvbn>=4.4.28",
]

[project.scripts]
verdikt = "verdikt.cli:app"

[project.entry-points."verdikt.plugins"]
storage = "verdikt.plugins.storage:StoragePlugin"
ao3 = "verdikt.plugins.ao3:AO3Plugin"
immich = "verdikt.plugins.immich:ImmichPlugin"
royalroad = "verdikt.plugins.royalroad:RoyalRoadPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "infra: requires running Ollama and ChromaDB (skip with -m 'not infra')",
]
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore::FutureWarning:sentence_transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verdikt*"]
