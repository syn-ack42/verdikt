# Verdikt — Docker Compose (Ollama on host)
# Use when Ollama is installed natively on your machine.
#
# Run: docker compose -f compose.native-ollama.yml up -d
#
# Before first run, generate a .env file:
#   python3 -m wizard        (interactive GUI)
#   bash installers/linux/install.sh   (Linux CLI)

services:
  verdikt:
    image: ghcr.io/verdikt/verdikt:latest
    restart: unless-stopped
    ports:
      - "${VERDIKT_PORT:-8765}:8765"
    volumes:
      - ${VERDIKT_HOST_DATA_DIR:-./verdikt_data}:/var/lib/verdikt
    environment:
      VERDIKT_JWT_SECRET: ${VERDIKT_JWT_SECRET}
      VERDIKT_APP_BASE_URL: ${VERDIKT_APP_BASE_URL:-http://localhost:8765}
      VERDIKT_CORS_ORIGINS: ${VERDIKT_CORS_ORIGINS:-'["http://localhost:8765"]'}
      VERDIKT_INFERENCE__OLLAMA_BASE_URL: http://host.docker.internal:11434
      VERDIKT_FRONTEND_DIR: /app/frontend/dist
      VERDIKT_DATA_DIR: /var/lib/verdikt
      VERDIKT_USERS_DIR: /var/lib/verdikt/users
    extra_hosts:
      - "host.docker.internal:host-gateway"
